name: build-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: bash scripts/build.sh
      - name: Fail if pfusch.min.js or README badges are out of date
        run: |
          git diff --exit-code -- pfusch.min.js Readme.md || {
            echo "::error::pfusch.min.js and/or Readme.md badges are stale. Run 'bash scripts/build.sh' and commit the result.";
            exit 1;
          }
